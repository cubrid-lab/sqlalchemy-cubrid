[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-cubrid"
dynamic = ["version"]
description = "CUBRID dialect for SQLAlchemy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Yeongseon Choe", email = "yeongseon.choe@gmail.com"},
    {name = "Gyeongjun Paik", email = "paikend@gmail.com"},
]
keywords = ["SQLAlchemy", "CUBRID", "dialect"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "sqlalchemy>=2.0,<2.2",
]

[project.optional-dependencies]
# Deprecated (#585): PyPI only has CUBRID-Python 9.3.x, which this dialect does
# not test or support. Kept so existing installs keep resolving; the supported
# CUBRIDdb is built from cubrid-python v11.3.0.51+ (docs/DRIVER_COMPAT.md), and
# CubridDialect warns at first connect when it finds an older CUBRIDdb.
cubrid = [
    "CUBRID-Python",
]
cubriddb = [
    "CUBRID-Python",
]
alembic = [
    "alembic>=1.7.2,<2.0",
]
pycubrid = [
    "pycubrid>=1.8.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<2.2",
]

# Contributor tooling (PEP 735, #765). Dependency groups are not part of the
# published package metadata, so `pip install sqlalchemy-cubrid` users never see
# them. Each pin is declared once here; scripts/check_tool_versions.py reads the
# Ruff and Mypy pins from the lint and typecheck groups. Install one group with
# `pip install --group <name>` (pip >= 25.1) or `uv pip install --group <name>`;
# `make install` installs the editable package plus the `dev` group.
# Documentation tools stay in .github/docs-requirements/requirements.txt (#761).
[dependency-groups]
test = [
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "hypothesis>=6.0",
    "PyYAML",
    "alembic>=1.7.2,<2.0",
    # scripts/check_docs_links.py and check_agents_docs.py parse Markdown (#908).
    "markdown-it-py>=4",
]
lint = [
    "ruff==0.17.1",
]
typecheck = [
    "mypy==2.4.0",
]
security = [
    "bandit[toml]==1.9.4",
]
mutation = [
    "mutmut>=3.8,<4",
]
release = [
    "build",
    "twine",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typecheck"},
    {include-group = "security"},
    {include-group = "mutation"},
    {include-group = "release"},
    "pre-commit",
    "tox>=4.22",
]

[project.urls]
Homepage = "https://github.com/cubrid-lab/sqlalchemy-cubrid"
Repository = "https://github.com/cubrid-lab/sqlalchemy-cubrid"
Documentation = "https://cubrid-lab.github.io/sqlalchemy-cubrid/"
Changelog = "https://github.com/cubrid-lab/sqlalchemy-cubrid/blob/main/CHANGELOG.md"
Issues = "https://github.com/cubrid-lab/sqlalchemy-cubrid/issues"

[project.entry-points."sqlalchemy.dialects"]
cubrid = "sqlalchemy_cubrid.dialect:CubridDialect"
"cubrid.cubrid" = "sqlalchemy_cubrid.dialect:CubridDialect"
"cubrid.cubriddb" = "sqlalchemy_cubrid.dialect:CubridDialect"
"cubrid.pycubrid" = "sqlalchemy_cubrid.pycubrid_dialect:PyCubridDialect"
"cubrid.aiopycubrid" = "sqlalchemy_cubrid.aio_pycubrid_dialect:PyCubridAsyncDialect"

# Alembic 1.18+ loads this group on ``import alembic``; the plugin registers
# CubridImpl so the dialect does not have to import Alembic itself (#595).
[project.entry-points."alembic.plugins"]
sqlalchemy_cubrid = "_sqlalchemy_cubrid_alembic"

[tool.setuptools]
packages = ["sqlalchemy_cubrid"]
# Alembic plugin shim (#595): top-level and stdlib-only, so loading the
# alembic.plugins entry point never imports the sqlalchemy_cubrid package.
py-modules = ["_sqlalchemy_cubrid_alembic"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "sqlalchemy_cubrid.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# Pin the rule set explicitly instead of inheriting ruff's implicit defaults.
# Ruff expanded its default selection in 0.16 (59 -> 413 rules against this
# config), which turns every routine ruff bump into a CI-breaking change
# unrelated to our own code. These four groups are exactly what ruff selected
# by default through 0.15.x.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["sqlalchemy_cubrid"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["test"]
skips = ["B101"]

[tool.coverage.run]
source = ["sqlalchemy_cubrid"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--tb native -v -r fxX --maxfail=25 -p no:warnings"
python_files = "test/*test_*.py"
markers = [
    "integration: test requires a live CUBRID instance (deselected by the offline suite via -m 'not integration')",
    "repo: repository-tooling test (Makefile, signal handling, repo scripts); applied by test/conftest.py REPO_TOOLING_MODULES, skipped by `make test`, run by `make test-repo` and the required repo-tests CI job",
]
