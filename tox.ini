[tox]
envlist = lint, typecheck-sa20, typecheck-sa21, py311, py312, py313, py314, py315, repo
skip_missing_interpreters = true
# dependency_groups (PEP 735 groups from pyproject.toml, #765) needs tox 4.22+.
requires = tox>=4.22

[testenv]
usedevelop = true
extras =
    pycubrid
    alembic
setenv = COVERAGE_FILE={envtmpdir}/.coverage
# lint and typecheck: test_tool_versions.py checks that the pinned Ruff and Mypy
# are installed in the environment that runs the suite.
dependency_groups =
    test
    lint
    typecheck
commands =
    pytest test/ -v \
        -m "not integration and not repo" \
        --cov=sqlalchemy_cubrid \
        --cov-report=term-missing \
        --cov-fail-under=95

# Repository-tooling tests (Makefile, signal handling, repo scripts; #594).
[testenv:repo]
commands = pytest test/ -v -m repo

# make lint and format-check run check_tool_versions.py, which also verifies the
# pinned Mypy.
[testenv:lint]
extras =
dependency_groups =
    lint
    typecheck
allowlist_externals = make
commands = make lint format-check PYTHON={envpython}

[testenv:typecheck-sa20]
basepython = python3.11
extras = alembic
dependency_groups = typecheck
deps =
    SQLAlchemy[asyncio]==2.0.53
setenv = MYPY_CACHE_DIR={envtmpdir}/mypy
allowlist_externals = make
commands = make typecheck PYTHON={envpython}

[testenv:typecheck-sa21]
basepython = python3.13
extras = alembic
dependency_groups = typecheck
deps =
    SQLAlchemy[asyncio]==2.1.1
setenv = MYPY_CACHE_DIR={envtmpdir}/mypy
allowlist_externals = make
commands = make typecheck PYTHON={envpython}

[testenv:integration]
usedevelop = true
passenv =
    CUBRID_TEST_URL
    CUBRID_TEST_AURL
commands =
    python -m scripts.check_integration_connection
    pytest test/ -m integration --ignore=test/test_suite.py -v
