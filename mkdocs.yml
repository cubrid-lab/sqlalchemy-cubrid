site_name: sqlalchemy-cubrid
site_description: SQLAlchemy 2.0 dialect for the CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/sqlalchemy-cubrid/
repo_url: https://github.com/cubrid-lab/sqlalchemy-cubrid
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: QUICKSTART.md
      - Connection Guide: CONNECTION.md
      - Driver Compatibility: DRIVER_COMPAT.md
  - Usage:
      - ORM Cookbook: ORM_COOKBOOK.md
      - DML Extensions: DML_EXTENSIONS.md
      - Type Mapping: TYPES.md
      - Isolation Levels: ISOLATION_LEVELS.md
      - Alembic Migrations: ALEMBIC.md
  - Reference:
      - Feature Support: FEATURE_SUPPORT.md
      - Support Matrix: SUPPORT_MATRIX.md
      - Architecture: ARCHITECTURE.md
  - Operations:
      - Performance: PERFORMANCE.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Project:
      - Development: DEVELOPMENT.md
      - Translations:
          - 한국어: README.ko.md
          - 한국어 문서:
              - 빠른 시작: ko/QUICKSTART.md
              - 연결과 드라이버 설정: ko/CONNECTION.md
              - 드라이버 호환성: ko/DRIVER_COMPAT.md
              - 격리 수준: ko/ISOLATION_LEVELS.md
              - 지원 매트릭스: ko/SUPPORT_MATRIX.md
              - 성능 가이드: ko/PERFORMANCE.md
              - 타입 매핑: ko/TYPES.md
              - 아키텍처: ko/ARCHITECTURE.md
          - Deutsch: README.de.md
          - हिन्दी: README.hi.md
          - Русский: README.ru.md
          - 中文: README.zh.md
      - Changelog: https://github.com/cubrid-lab/sqlalchemy-cubrid/blob/main/CHANGELOG.md
      - Contributing: https://github.com/cubrid-lab/sqlalchemy-cubrid/blob/main/CONTRIBUTING.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/sqlalchemy-cubrid
