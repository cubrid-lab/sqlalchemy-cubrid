site_name: sqlalchemy-cubrid
site_description: SQLAlchemy 2.0 dialect for the CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/sqlalchemy-cubrid/
repo_url: https://github.com/cubrid-lab/sqlalchemy-cubrid
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: QUICKSTART.md
      - Connection Guide: CONNECTION.md
      - Driver Compatibility: DRIVER_COMPAT.md
  - Usage:
      - ORM Cookbook: ORM_COOKBOOK.md
      - DML Extensions: DML_EXTENSIONS.md
      - Type Mapping: TYPES.md
      - Isolation Levels: ISOLATION_LEVELS.md
      - Alembic Migrations: ALEMBIC.md
  - Reference:
      - Feature Support: FEATURE_SUPPORT.md
      - Support Matrix: SUPPORT_MATRIX.md
      - Architecture: ARCHITECTURE.md
      - SQLAlchemy Internal API Compatibility: SA_COMPAT.md
  - Operations:
      - Performance: PERFORMANCE.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Project:
      - Development: DEVELOPMENT.md
      - CI Execution Policy: CI_POLICY.md
      - Product Requirements: PRD.md
      - Release-please Validation: RELEASE_PLEASE_VALIDATION.md
      - Translations:
          - Deutsch: README.de.md
          - हिन्दी: README.hi.md
          - Русский: README.ru.md
          - 中文: README.zh.md
      - Changelog: https://github.com/cubrid-lab/sqlalchemy-cubrid/blob/main/CHANGELOG.md
      - Contributing: https://github.com/cubrid-lab/sqlalchemy-cubrid/blob/main/CONTRIBUTING.md
  - 한국어:
      - 홈: ko/index.md
      - 시작하기:
          - 빠른 시작: ko/QUICKSTART.md
          - 연결과 드라이버 설정: ko/CONNECTION.md
          - 드라이버 호환성: ko/DRIVER_COMPAT.md
      - 사용:
          - ORM 쿡북: ko/ORM_COOKBOOK.md
          - DML 확장: ko/DML_EXTENSIONS.md
          - 타입 매핑: ko/TYPES.md
          - 격리 수준: ko/ISOLATION_LEVELS.md
          - Alembic 마이그레이션: ko/ALEMBIC.md
      - 참고:
          - 기능 지원 비교: ko/FEATURE_SUPPORT.md
          - 지원 매트릭스: ko/SUPPORT_MATRIX.md
          - 아키텍처: ko/ARCHITECTURE.md
          - SQLAlchemy 내부 API 호환성: ko/SA_COMPAT.md
      - 운영:
          - 성능 가이드: ko/PERFORMANCE.md
          - 문제 해결: ko/TROUBLESHOOTING.md
      - 프로젝트:
          - 개발 가이드: ko/DEVELOPMENT.md
          - CI 실행 정책: ko/CI_POLICY.md
          - 기여 가이드: CONTRIBUTING.ko.md
          - 제품 요구사항: ko/PRD.md
          - Release-please 검증: ko/RELEASE_PLEASE_VALIDATION.md
          - README: README.ko.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/sqlalchemy-cubrid
