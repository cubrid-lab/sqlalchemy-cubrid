site_name: sqlalchemy-cubrid
site_description: SQLAlchemy 2.0 dialect for the CUBRID database
site_author: cubrid-lab
site_url: https://cubrid-lab.github.io/sqlalchemy-cubrid/
repo_url: https://github.com/cubrid-lab/sqlalchemy-cubrid
edit_uri: edit/main/docs/

theme:
  name: material
  # CUBRID Lab repository icon, pinned to an immutable cubrid-lab/brand commit.
  logo: https://raw.githubusercontent.com/cubrid-lab/brand/94e2bf6b915d7ef6a1111e06376f693f70bf6c4e/dist/icons/sqlalchemy-cubrid.svg
  favicon: https://raw.githubusercontent.com/cubrid-lab/brand/94e2bf6b915d7ef6a1111e06376f693f70bf6c4e/dist/icons/sqlalchemy-cubrid.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Start here:
      - "Your First Connection": QUICKSTART.md
      - "1. Prepare CUBRID and Python": LESSON_PREPARE.md
      - "2. Run your first query": LESSON_FIRST_QUERY.md
      - "3. Save a row and read it back": LESSON_SAVE_ROW.md
      - "4. Undo changes with a rollback": LESSON_TRANSACTIONS.md
      - "5. Clean up": LESSON_FINISH.md
  - How-to guides:
      - "Connect and configure the driver": CONNECTION.md
      - "Use the ORM (ORM Cookbook)": ORM_COOKBOOK.md
      - "Run migrations (Alembic)": ALEMBIC.md
      - "Use CUBRID-specific DML": DML_EXTENSIONS.md
      - "Choose an isolation level": ISOLATION_LEVELS.md
  - Reference:
      - Type Mapping: TYPES.md
      - Feature Support: FEATURE_SUPPORT.md
      - Support Matrix: SUPPORT_MATRIX.md
      - Driver Compatibility: DRIVER_COMPAT.md
  - Help:
      - Troubleshooting: TROUBLESHOOTING.md
  - Project and internals:
      - Architecture: ARCHITECTURE.md
      - SQLAlchemy Internal API Compatibility: SA_COMPAT.md
      - Performance: PERFORMANCE.md
      - Development: DEVELOPMENT.md
      - CI Execution Policy: CI_POLICY.md
      - Product Requirements: PRD.md
      - Release-please Validation: RELEASE_PLEASE_VALIDATION.md
      - Translations:
          - Deutsch: README.de.md
          - हिन्दी: README.hi.md
          - Русский: README.ru.md
          - 中文: README.zh.md
      - Changelog: https://github.com/cubrid-lab/sqlalchemy-cubrid/blob/main/CHANGELOG.md
      - Contributing: https://github.com/cubrid-lab/sqlalchemy-cubrid/blob/main/CONTRIBUTING.md
  - 한국어:
      - 홈: ko/index.md
      - 여기서 시작:
          - "첫 연결": ko/QUICKSTART.md
          - "1. CUBRID와 Python 준비": ko/LESSON_PREPARE.md
          - "2. 첫 쿼리 실행": ko/LESSON_FIRST_QUERY.md
          - "3. 행을 저장하고 다시 읽기": ko/LESSON_SAVE_ROW.md
          - "4. 롤백으로 변경 취소하기": ko/LESSON_TRANSACTIONS.md
          - "5. 정리": ko/LESSON_FINISH.md
      - 작업 가이드:
          - "드라이버 연결과 설정": ko/CONNECTION.md
          - "ORM 사용하기 (ORM 쿡북)": ko/ORM_COOKBOOK.md
          - "마이그레이션 실행 (Alembic)": ko/ALEMBIC.md
          - "CUBRID 전용 DML 사용하기": ko/DML_EXTENSIONS.md
          - "격리 수준 고르기": ko/ISOLATION_LEVELS.md
      - 레퍼런스:
          - 타입 매핑: ko/TYPES.md
          - 기능 지원 비교: ko/FEATURE_SUPPORT.md
          - 지원 매트릭스: ko/SUPPORT_MATRIX.md
          - 드라이버 호환성: ko/DRIVER_COMPAT.md
      - 도움말:
          - 문제 해결: ko/TROUBLESHOOTING.md
      - 프로젝트와 내부 구조:
          - 아키텍처: ko/ARCHITECTURE.md
          - SQLAlchemy 내부 API 호환성: ko/SA_COMPAT.md
          - 성능 가이드: ko/PERFORMANCE.md
          - 개발 가이드: ko/DEVELOPMENT.md
          - CI 실행 정책: ko/CI_POLICY.md
          - 기여 가이드: CONTRIBUTING.ko.md
          - 제품 요구사항: ko/PRD.md
          - Release-please 검증: ko/RELEASE_PLEASE_VALIDATION.md
          - README: README.ko.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
      # Unicode-aware slugs, as GitHub renders them: the default slugifier drops
      # non-ASCII characters, which left every Korean heading without a usable id.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      # Material renders ```mermaid fences as diagrams on the site (#1013).
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

# Links each built page that carries the marker to its source commit (#946).
hooks:
  - scripts/docs_provenance_hook.py

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cubrid-lab/sqlalchemy-cubrid
