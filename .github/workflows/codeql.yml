name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  # A newer push to a PR supersedes its older run. Every non-PR run gets a
  # unique group, so main, release and scheduled runs are never cancelled and
  # never replaced while queued behind another run of the same ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    uses: cubrid-lab/.github/.github/workflows/codeql.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      language: python
