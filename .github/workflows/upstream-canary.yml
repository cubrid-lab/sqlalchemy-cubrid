name: Upstream Canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Offline test suite against pycubrid@main (HEAD).
  upstream-canary:
    name: Offline tests against pycubrid@main
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install --force-reinstall "git+https://github.com/cubrid-lab/pycubrid.git@main"
      - run: pytest test/ --ignore=test/test_integration.py --ignore=test/test_aio_integration.py -q

  # Integration + async integration suite against pycubrid@main (HEAD).
  # Ensures cross-stack fixes landing in pycubrid main are exercised by the
  # online suite, not just offline tests (#323). The regular CI paths install
  # the released PyPI range; this job is the one that pins git HEAD end-to-end.
  upstream-canary-integration:
    name: Integration tests against pycubrid@main
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      cubrid:
        image: cubrid/cubrid:11.4
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Install pycubrid@main (HEAD)
        run: pip install --force-reinstall "git+https://github.com/cubrid-lab/pycubrid.git@main"
      - name: Wait for CUBRID to be ready
        run: |
          for i in $(seq 1 30); do
            if python -c "
          import pycubrid
          try:
              conn = pycubrid.connect(host='localhost', port=33000, db='testdb', user='dba', password='')
              cur = conn.cursor()
              cur.execute('SELECT 1')
              cur.close()
              conn.close()
              print('CUBRID ready')
              exit(0)
          except Exception as e:
              print(f'Attempt $i: {e}')
              exit(1)
          "; then
              break
            fi
            echo "Waiting for CUBRID... (attempt $i/30)"
            sleep 5
          done
      - name: Run integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
        run: python -m pytest test/test_integration.py -v --tb=short
      - name: Run async integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
        run: python -m pytest test/test_aio_integration.py -v --tb=short
