name: Integration Full Matrix

# Full Python x CUBRID compatibility validation.
# Regular CI runs {3.10, 3.14} x all CUBRID versions on every PR/push.
# This workflow runs the full 5x4 matrix on a nightly schedule, on demand
# (workflow_dispatch), and before tagged releases.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: integration-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        cubrid-version: ["10.2", "11.0", "11.2", "11.4"]
    services:
      cubrid:
        image: cubrid/cubrid:${{ matrix.cubrid-version }}
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build and install CUBRID Python driver
        run: |
          git clone --branch v11.3.0.51 --depth 1 --recurse-submodules \
            https://github.com/CUBRID/cubrid-python.git /tmp/cubrid-python
          cd /tmp/cubrid-python

          mkdir -p cci-src/build_x86_64_release
          cd cci-src/build_x86_64_release
          cmake ../
          make -j$(nproc)
          cd /tmp/cubrid-python

          echo '#!/bin/bash' > build_cci.sh
          echo 'exit 0' >> build_cci.sh
          chmod +x build_cci.sh

          pip install .

      - name: Install project
        run: |
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Wait for CUBRID to be ready
        run: |
          for i in $(seq 1 30); do
            if python -c "
          import CUBRIDdb
          try:
              conn = CUBRIDdb.connect('CUBRID:localhost:33000:testdb:::', 'dba', '')
              cur = conn.cursor()
              cur.execute('SELECT 1')
              cur.close()
              conn.close()
              print('CUBRID ready')
              exit(0)
          except Exception as e:
              print(f'Attempt $i: {e}')
              exit(1)
          "; then
              break
            fi
            echo "Waiting for CUBRID... (attempt $i/30)"
            sleep 5
          done

      - name: Run integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
        run: |
          python -m pytest test/test_integration.py -v --tb=short

      - name: Run async integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
        run: |
          # Release-verification: install the released pycubrid within the declared
          # support range ([pycubrid] extra = pycubrid>=1.8.0,<2.0) so async integration
          # runs against a supported release (pytest-asyncio already comes from the [dev]
          # extra installed above). Testing against pycubrid@main (HEAD) is
          # handled separately by upstream-canary.yml.
          pip install -e ".[pycubrid]"
          python -m pytest test/test_aio_integration.py -v --tb=short

      - name: Run driver-differential comparison (required)
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
          # Fails the step when no comparison ran and passed (all skipped or
          # none collected); see test/conftest.py and #486.
          CUBRID_REQUIRE_DRIVER_DIFFERENTIAL: "1"
          VERSION_REPORT_TITLE: "Driver-differential versions (Python ${{ matrix.python-version }}, CUBRID ${{ matrix.cubrid-version }})"
        run: |
          CUBRIDDB_SOURCE_REF="$(git -C /tmp/cubrid-python describe --tags --always)" \
            python -m scripts.report_driver_versions
          python -m pytest test/test_driver_differential.py -v --tb=short -rs

      - name: Run transactional DDL tests (#503)
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
          # Feeds Alembic's offline --sql output to csql inside the service container.
          CUBRID_CSQL: "docker exec -i ${{ job.services.cubrid.id }} csql -u dba testdb"
          # Fail instead of skip when a driver, the server or csql is unavailable.
          CUBRID_REQUIRE_TRANSACTIONAL_DDL: "1"
        run: |
          python -m pytest test/test_transactional_ddl.py -v --tb=short -rs

      # Snapshot generation is gated to a single Python (3.12) so the 5x4
      # Python x CUBRID matrix yields exactly one artifact per CUBRID version,
      # which the version-differential job below compares.
      - name: Generate version-differential snapshot
        if: matrix.python-version == '3.12'
        env:
          CUBRID_TEST_URL: "cubrid+pycubrid://dba@localhost:33000/testdb"
        run: |
          python -m test.version_differential.snapshot \
            --url "$CUBRID_TEST_URL" \
            --out "snapshot-${{ matrix.cubrid-version }}.json" \
            --label "${{ matrix.cubrid-version }}"

      - name: Upload version-differential snapshot
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: vdiff-snapshot-${{ matrix.cubrid-version }}
          path: snapshot-${{ matrix.cubrid-version }}.json
          retention-days: 7

  full-matrix-result:
    name: Full compatibility matrix result
    runs-on: ubuntu-latest
    needs: [integration-full]
    if: always()
    steps:
      - name: Require all matrix cells to pass
        run: |
          if [ "${{ needs.integration-full.result }}" != "success" ]; then
            echo "::error::Full compatibility matrix failed: ${{ needs.integration-full.result }}"
            exit 1
          fi
          echo "Full compatibility matrix passed."

  version-differential:
    name: CUBRID version-differential
    runs-on: ubuntu-latest
    needs: [integration-full]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download all version snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: vdiff-snapshot-*
          merge-multiple: true

      - name: Compare snapshots across CUBRID versions
        run: |
          shopt -s nullglob
          snapshots=(snapshot-*.json)
          if [ "${#snapshots[@]}" -lt 2 ]; then
            echo "::error::Expected >=2 version snapshots, found ${#snapshots[@]}. Snapshot generation in the matrix likely failed."
            exit 1
          fi
          python -m test.version_differential.compare_snapshots "${snapshots[@]}"

  # Property-based bug hunt (stabilization Phases 1-4): run the Hypothesis fuzz
  # and metamorphic suites with the extended "nightly" profile (2000
  # examples/test) against a live CUBRID. PR CI already runs these files with
  # the fast "dev" profile, so this job is the deep, expensive pass that only
  # runs on the nightly schedule and on demand.
  fuzz-bug-hunt:
    name: Hypothesis fuzz bug hunt (nightly)
    uses: cubrid-lab/.github/.github/workflows/live-smoke.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      cubrid-version: "11.4"
      python-version: "3.12"
      cubrid-test-url: "cubrid+pycubrid://dba@localhost:33000/testdb"
      setup-command: >-
        python -m pip install --upgrade pip &&
        pip install -e ".[dev,pycubrid]"
      test-command: >-
        HYPOTHESIS_PROFILE=nightly python -m pytest
        test/test_fuzz_select.py test/test_fuzz_insert.py
        test/test_fuzz_reflection.py test/test_metamorphic.py
        test/capability/ test/test_driver_differential.py
        test/test_dogfood_orm.py test/test_uuid_contract.py
        -v --tb=short

  # Mutation testing (stabilization Phase 8): measure whether the offline suite
  # actually verifies compiler.py logic, not just executes it. Non-gating
  # (continue-on-error) because a mutation-score dip is a signal to strengthen a
  # test, not a reason to block the release; the run needs no database.
  mutation-testing:
    name: Mutation testing (nightly, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run mutmut on compiler.py
        # Configuration lives in setup.cfg [mutmut] (mutmut 3). A crashed run,
        # a failing clean test run, or zero generated mutants fails this step;
        # surviving mutants only lower the reported score (the job stays
        # continue-on-error, so it never blocks the workflow).
        run: |
          set -euo pipefail
          env -u CUBRID_TEST_URL mutmut run
          echo "::group::Mutation results (non-killed mutants)"
          env -u CUBRID_TEST_URL mutmut results
          echo "::endgroup::"
          env -u CUBRID_TEST_URL mutmut export-cicd-stats
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("mutants/mutmut-cicd-stats.json")
          if not path.is_file():
              sys.exit("::error::mutmut produced no mutation data (mutants/mutmut-cicd-stats.json missing)")
          stats = json.loads(path.read_text())
          print(json.dumps(stats, indent=2))
          total, killed = stats["total"], stats["killed"]
          if total == 0:
              sys.exit("::error::mutmut generated zero mutants for compiler.py")
          if killed == 0:
              sys.exit("::error::mutmut killed zero mutants; the test harness is likely broken")
          print(f"Mutation score: {killed}/{total} ({100 * killed / total:.1f}%)")
          PY
