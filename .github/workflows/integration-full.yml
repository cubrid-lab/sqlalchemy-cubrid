name: Integration Full Matrix

# Full Python x CUBRID compatibility validation.
# Routine CI uses representative combinations; see docs/CI_POLICY.md.
# Full verification runs only on explicit dispatch or a release workflow call.
# (workflow_dispatch), and as the release gate: publish-pypi.yml calls it through
# workflow_call with the release commit SHA.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: "Full commit SHA to test (publish-pypi.yml passes the release commit)"
        required: true
        type: string

# Full verification runs only on explicit dispatch or a release workflow call.
# Manual runs replace older pending runs; release calls are isolated by SHA.
concurrency:
  group: integration-full-${{ inputs.sha && format('release-{0}', inputs.sha) || github.ref }}
  cancel-in-progress: ${{ !inputs.sha }}

jobs:
  integration-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        cubrid-version: ["10.2", "11.0", "11.2", "11.4"]
    services:
      cubrid:
        image: cubrid/cubrid:${{ matrix.cubrid-version }}
        env:
          CUBRID_DB: testdb
        ports:
          - 33000:33000
        options: >-
          --health-cmd "csql -u dba testdb -c 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}

      - name: Fetch CUBRID Python driver source
        id: cubriddb-src
        run: |
          git clone --branch v11.3.0.51 --depth 1 --recurse-submodules \
            https://github.com/CUBRID/cubrid-python.git /tmp/cubrid-python
          {
            echo "commit=$(git -C /tmp/cubrid-python rev-parse HEAD)"
            echo "soabi=$(python -c 'import sysconfig; print(sysconfig.get_config_var("SOABI"))')"
            echo "image=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"

      # The driver wheel links CCI statically (libcascci.a) and needs only libc
      # and libstdc++, so it depends on the Python ABI, the runner image and the
      # driver source commit, not on the CUBRID server version: the server cells
      # of one Python version share it (#745). A cache hit is not evidence of a
      # working driver; the readiness step below imports CUBRIDdb and connects.
      - name: Restore the CUBRID Python driver wheel
        id: cubriddb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cubriddb-wheel
          key: cubriddb-wheel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cubriddb-src.outputs.image }}-${{ steps.cubriddb-src.outputs.soabi }}-${{ steps.cubriddb-src.outputs.commit }}

      - name: Install system dependencies
        if: steps.cubriddb-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build the CUBRID Python driver wheel
        if: steps.cubriddb-cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp/cubrid-python

          # Build CCI library
          mkdir -p cci-src/build_x86_64_release
          cd cci-src/build_x86_64_release
          cmake ../
          make -j$(nproc)
          cd /tmp/cubrid-python

          # Patch build_cci.sh to skip rebuild
          echo '#!/bin/bash' > build_cci.sh
          echo 'exit 0' >> build_cci.sh
          chmod +x build_cci.sh

          uv build --wheel --python "$(command -v python)" --out-dir /tmp/cubriddb-wheel .

      - name: Install the CUBRID Python driver
        run: |
          ls -l /tmp/cubriddb-wheel
          uv pip install --system /tmp/cubriddb-wheel/cubrid_python-*.whl
          python -c "import CUBRIDdb, _cubrid; print('CUBRIDdb from', CUBRIDdb.__file__)"

      - name: Install project
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pytest-cov
          uv pip freeze --system

      # The oldest Python row keeps the minimum supported SQLAlchemy line (2.0.x),
      # which Python 3.10 selected by itself before it was retired.
      - name: Pin the minimum SQLAlchemy line in the oldest Python row
        if: matrix.python-version == '3.11'
        run: |
          uv pip install --system "sqlalchemy[asyncio]>=2.0,<2.1"
          uv pip freeze --system | grep -i '^sqlalchemy=='

      - name: Wait for CUBRID to be ready
        run: |
          for i in $(seq 1 30); do
            if python -c "
          import CUBRIDdb
          try:
              conn = CUBRIDdb.connect('CUBRID:localhost:33000:testdb:::', 'dba', '')
              cur = conn.cursor()
              cur.execute('SELECT 1')
              cur.close()
              conn.close()
              print('CUBRID ready')
              exit(0)
          except Exception as e:
              print(f'Attempt $i: {e}')
              exit(1)
          "; then
              break
            fi
            echo "Waiting for CUBRID... (attempt $i/30)"
            sleep 5
          done

      - name: Run integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
        run: |
          set -o pipefail
          python -m pytest test/test_integration.py -v --tb=short | tee integration.log
          python -m scripts.check_not_all_skipped integration.log --label "Run integration tests"

      - name: Run async integration tests
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
        run: |
          # Release-verification: install the released pycubrid within the declared
          # support range ([pycubrid] extra = pycubrid>=1.8.0,<2.0) so async integration
          # runs against a supported release (pytest-asyncio already comes from the [dev]
          # extra installed above). Testing against pycubrid@main (HEAD) is
          # handled separately by upstream-canary.yml.
          uv pip install --system -e ".[pycubrid]"
          set -o pipefail
          python -m pytest test/test_aio_integration.py test/test_lob_value_contract.py test/test_scalar_execution_contract.py -v --tb=short | tee async-integration.log
          python -m scripts.check_not_all_skipped async-integration.log --label "Run async integration tests"

      - name: Run driver-differential comparison (required)
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
          # Fails the step when no comparison ran and passed (all skipped or
          # none collected); see test/conftest.py and #486.
          CUBRID_REQUIRE_DRIVER_DIFFERENTIAL: "1"
          VERSION_REPORT_TITLE: "Driver-differential versions (Python ${{ matrix.python-version }}, CUBRID ${{ matrix.cubrid-version }})"
        run: |
          CUBRIDDB_SOURCE_REF="$(git -C /tmp/cubrid-python describe --tags --always)" \
            python -m scripts.report_driver_versions
          python -m pytest test/test_driver_differential.py -v --tb=short -rs

      - name: Run transactional DDL tests (#503)
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
          # Feeds Alembic's offline --sql output to csql inside the service container.
          CUBRID_CSQL: "docker exec -i ${{ job.services.cubrid.id }} csql -u dba testdb"
          # Fail instead of skip when a driver, the server or csql is unavailable.
          CUBRID_REQUIRE_TRANSACTIONAL_DDL: "1"
        run: |
          python -m pytest test/test_transactional_ddl.py -v --tb=short -rs

      # Recorded SHOW CREATE TABLE output per supported CUBRID version (#611),
      # ENUM / collection column reflection from it (#631) and the
      # unique-constraint DDL fallback conditions (#610): one Python lane is
      # enough to check every version (PR CI covers only 10.2 and 11.4).
      - name: Check recorded SHOW CREATE TABLE output and unique-constraint fallback
        if: matrix.python-version == '3.12'
        env:
          CUBRID_TEST_URL: "cubrid+pycubrid://dba@localhost:33000/testdb"
        run: |
          set -o pipefail
          python -m pytest test/test_show_create_table_server_output.py \
            test/test_reflection_enum_collection.py \
            test/test_unique_constraint_fallback.py -m integration -v --tb=short | tee show-create-table.log
          python -m scripts.check_not_all_skipped show-create-table.log \
            --label "Check recorded SHOW CREATE TABLE output and unique-constraint fallback"

      # Snapshot generation is gated to a single Python (3.12) so the 5x4
      # Python x CUBRID matrix yields exactly one artifact per CUBRID version,
      # which the version-differential job below compares.
      - name: Generate version-differential snapshot
        if: matrix.python-version == '3.12'
        env:
          CUBRID_TEST_URL: "cubrid+pycubrid://dba@localhost:33000/testdb"
        run: |
          python -m test.version_differential.snapshot \
            --url "$CUBRID_TEST_URL" \
            --out "snapshot-${{ matrix.cubrid-version }}.json" \
            --label "${{ matrix.cubrid-version }}"

      - name: Upload version-differential snapshot
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vdiff-snapshot-${{ matrix.cubrid-version }}
          path: snapshot-${{ matrix.cubrid-version }}.json
          retention-days: 7

      - name: Run cub_server stop/start pool recovery tests (#565)
        # Last step: it stops and restarts cub_server in the service container.
        if: ${{ !cancelled() }}
        env:
          CUBRID_TEST_URL: "cubrid://dba@localhost:33000/testdb"
          CUBRID_TEST_DOCKER_CONTAINER: ${{ job.services.cubrid.id }}
          # Fail instead of skip when a driver or the container is unavailable.
          CUBRID_REQUIRE_SERVER_RESTART: "1"
        run: |
          python -m pytest test/test_server_restart.py -v --tb=short -rs

  make-integration:
    # `make integration` for both drivers on the CUBRID versions CI gates
    # (#575): the whole `integration`-marked suite in one pytest session, as
    # contributors run it locally. PR CI runs only the default pycubrid cell
    # (ci.yml); the CUBRIDdb session takes a C-extension build and another
    # full-suite run, so it runs here, on full dispatch and as the release gate.
    name: make integration (${{ matrix.driver }}, CUBRID ${{ matrix.cubrid-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        driver: ["pycubrid", "cubriddb"]
        cubrid-version: ["10.2", "11.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}

      - name: Fetch CUBRID Python driver source
        id: cubriddb-src
        if: matrix.driver == 'cubriddb'
        run: |
          git clone --branch v11.3.0.51 --depth 1 --recurse-submodules \
            https://github.com/CUBRID/cubrid-python.git /tmp/cubrid-python
          {
            echo "commit=$(git -C /tmp/cubrid-python rev-parse HEAD)"
            echo "soabi=$(python -c 'import sysconfig; print(sysconfig.get_config_var("SOABI"))')"
            echo "image=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"

      # The driver wheel links CCI statically (libcascci.a) and needs only libc
      # and libstdc++, so it depends on the Python ABI, the runner image and the
      # driver source commit, not on the CUBRID server version: the server cells
      # of one Python version share it (#745). A cache hit is not evidence of a
      # working driver; the readiness step below imports CUBRIDdb and connects.
      - name: Restore the CUBRID Python driver wheel
        id: cubriddb-cache
        if: matrix.driver == 'cubriddb'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cubriddb-wheel
          key: cubriddb-wheel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cubriddb-src.outputs.image }}-${{ steps.cubriddb-src.outputs.soabi }}-${{ steps.cubriddb-src.outputs.commit }}

      - name: Install system dependencies
        if: matrix.driver == 'cubriddb' && steps.cubriddb-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build the CUBRID Python driver wheel
        if: matrix.driver == 'cubriddb' && steps.cubriddb-cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp/cubrid-python

          # Build CCI library
          mkdir -p cci-src/build_x86_64_release
          cd cci-src/build_x86_64_release
          cmake ../
          make -j$(nproc)
          cd /tmp/cubrid-python

          # Patch build_cci.sh to skip rebuild
          echo '#!/bin/bash' > build_cci.sh
          echo 'exit 0' >> build_cci.sh
          chmod +x build_cci.sh

          uv build --wheel --python "$(command -v python)" --out-dir /tmp/cubriddb-wheel .

      - name: Install the CUBRID Python driver
        if: matrix.driver == 'cubriddb'
        run: |
          ls -l /tmp/cubriddb-wheel
          uv pip install --system /tmp/cubriddb-wheel/cubrid_python-*.whl
          python -c "import CUBRIDdb, _cubrid; print('CUBRIDdb from', CUBRIDdb.__file__)"

      - name: Install project
        # pycubrid is installed in both cells: several integration files compare
        # or exercise both drivers whichever one CUBRID_TEST_URL selects.
        run: |
          uv pip install --system -e ".[dev,pycubrid]"
          uv pip freeze --system

      - name: Run make integration
        env:
          CUBRID_VERSION: ${{ matrix.cubrid-version }}
        run: |
          set -o pipefail
          make integration INTEGRATION_DRIVER=${{ matrix.driver }} 2>&1 | tee make-integration.log
      - name: Guard against an all-skipped make integration run (#486)
        run: |
          python -m scripts.check_not_all_skipped make-integration.log \
            --label "make integration (${{ matrix.driver }}, CUBRID ${{ matrix.cubrid-version }})"

  # Oldest/newest supported Python offline suite (#734) on the exact release
  # SHA (#737). A main push of ci.yml runs the same cells, but nothing in the
  # release path required that run to succeed, and a later merge can cancel it
  # through the push concurrency group. The release therefore runs these two
  # short cells itself and full-matrix-result requires them, instead of polling
  # for another workflow's run. Keep the cells equal to the ci.yml push cells.
  offline-endpoints:
    name: offline-endpoints (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pytest-cov alembic tomli
          uv pip freeze --system
      - name: Run offline tests with coverage
        run: |
          python -m pytest \
            test/ \
            -m "not integration and not repo" \
            -v --tb=short \
            --cov=sqlalchemy_cubrid \
            --cov-report=term-missing \
            --cov-fail-under=95

  full-matrix-result:
    name: Full compatibility matrix result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [integration-full, make-integration, offline-endpoints]
    if: always()
    steps:
      - name: Require all matrix cells to pass
        run: |
          if [ "${{ needs.integration-full.result }}" != "success" ]; then
            echo "::error::Full compatibility matrix failed: ${{ needs.integration-full.result }}"
            exit 1
          fi
          if [ "${{ needs.make-integration.result }}" != "success" ]; then
            echo "::error::make integration matrix failed: ${{ needs.make-integration.result }}"
            exit 1
          fi
          if [ "${{ needs.offline-endpoints.result }}" != "success" ]; then
            echo "::error::Offline Python endpoint cells failed: ${{ needs.offline-endpoints.result }}"
            exit 1
          fi
          echo "Full compatibility matrix passed."

  version-differential:
    name: CUBRID version-differential
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [integration-full]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download all version snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vdiff-snapshot-*
          merge-multiple: true

      - name: Compare snapshots across CUBRID versions
        run: |
          shopt -s nullglob
          snapshots=(snapshot-*.json)
          if [ "${#snapshots[@]}" -lt 2 ]; then
            echo "::error::Expected >=2 version snapshots, found ${#snapshots[@]}. Snapshot generation in the matrix likely failed."
            exit 1
          fi
          python -m test.version_differential.compare_snapshots "${snapshots[@]}"

  # Property-based bug hunt (stabilization Phases 1-4): run the Hypothesis fuzz
  # and metamorphic suites with the extended "nightly" profile (2000
  # examples/test; the name is the Hypothesis profile, not a schedule) against
  # a live CUBRID. PR CI already runs these files with the fast "dev" profile,
  # so this job is the deep, expensive pass that only runs on manual dispatch
  # and in the release gate (there is no schedule).
  # live-smoke.yml checks out github.sha (it has no ref input); that is the
  # release SHA on a release push or dry run, so the job is skipped only when a
  # recovery run tests an older release commit.
  fuzz-bug-hunt:
    name: Hypothesis fuzz bug hunt
    if: ${{ !inputs.sha || inputs.sha == github.sha }}
    uses: cubrid-lab/.github/.github/workflows/live-smoke.yml@f7d8c0f6c28392c10306f367de38b40f13eed4b7
    with:
      cubrid-version: "11.4"
      python-version: "3.12"
      cubrid-test-url: "cubrid+pycubrid://dba@localhost:33000/testdb"
      setup-command: >-
        python -m pip install --upgrade pip &&
        pip install -e ".[dev,pycubrid]"
      test-command: >-
        HYPOTHESIS_PROFILE=nightly python -m pytest
        test/test_fuzz_select.py test/test_fuzz_insert.py
        test/test_fuzz_reflection.py test/test_metamorphic.py
        test/capability/ test/test_driver_differential.py
        test/test_dogfood_orm.py test/test_uuid_contract.py
        -v --tb=short

  # Mutation testing (stabilization Phase 8): measure whether the offline suite
  # actually verifies compiler.py logic, not just executes it. Non-gating
  # (continue-on-error) because a mutation-score dip is a signal to strengthen a
  # test, not a reason to block the release; the run needs no database.
  mutation-testing:
    name: Mutation testing (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.12.17"
          enable-cache: auto
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ github.job }}
      - name: Install project
        run: |
          uv pip install --system -e ".[dev]"
          uv pip freeze --system
      - name: Run mutmut on compiler.py
        # Configuration lives in setup.cfg [mutmut] (mutmut 3). A crashed run,
        # a failing clean test run, or zero generated mutants fails this step;
        # surviving mutants only lower the reported score (the job stays
        # continue-on-error, so it never blocks the workflow).
        run: |
          set -euo pipefail
          env -u CUBRID_TEST_URL mutmut run
          echo "::group::Mutation results (non-killed mutants)"
          env -u CUBRID_TEST_URL mutmut results
          echo "::endgroup::"
          env -u CUBRID_TEST_URL mutmut export-cicd-stats
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("mutants/mutmut-cicd-stats.json")
          if not path.is_file():
              sys.exit("::error::mutmut produced no mutation data (mutants/mutmut-cicd-stats.json missing)")
          stats = json.loads(path.read_text())
          print(json.dumps(stats, indent=2))
          total, killed = stats["total"], stats["killed"]
          if total == 0:
              sys.exit("::error::mutmut generated zero mutants for compiler.py")
          if killed == 0:
              sys.exit("::error::mutmut killed zero mutants; the test harness is likely broken")
          print(f"Mutation score: {killed}/{total} ({100 * killed / total:.1f}%)")
          PY
