name: Correct v1.12.2 published release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-v1-12-2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-v1-12-2-release
  cancel-in-progress: false

jobs:
  correct-release-body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify approved original snapshot and prepare
        id: original
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path
          original = Path("docs/release-backups/v1.12.2-original.md").read_bytes()
          print("sha256=" + hashlib.sha256(original).hexdigest())
          PY

      - name: Preview exact release body update
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ steps.original.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/sync_historical_release.py \
            --tag v1.12.2 \
            --previous-tag v1.12.1 \
            --expected-sha256 "$EXPECTED_SHA256"

      - name: Update published release body without touching tag or assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ steps.original.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/sync_historical_release.py \
            --tag v1.12.2 \
            --previous-tag v1.12.1 \
            --expected-sha256 "$EXPECTED_SHA256" \
            --apply

      - name: Verify the published release body matches curated changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from sync_historical_release import extract_version, make_body
          section = extract_version(Path("CHANGELOG.md").read_text(), "1.12.2")
          expected = make_body(section, "v1.12.1", "v1.12.2", "cubrid-lab/sqlalchemy-cubrid")
          actual = subprocess.check_output(
              ["gh", "api", "repos/cubrid-lab/sqlalchemy-cubrid/releases/tags/v1.12.2",
               "--jq", ".body"], text=True
          ).rstrip("\n")
          if actual != expected:
              raise SystemExit("Published body verification failed")
          print("Published v1.12.2 body matches the curated changelog.")
          PY
