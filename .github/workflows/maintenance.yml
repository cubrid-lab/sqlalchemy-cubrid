name: Maintenance Checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Dependency groups (#765) need pip >= 25.1.
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install --group lint --group security

      - name: Run lint checks
        run: |
          ruff check sqlalchemy_cubrid/ test/
          ruff format --check sqlalchemy_cubrid/ test/

      - name: Run security scan
        run: |
          bandit -r sqlalchemy_cubrid/ -c pyproject.toml
