# Release automatically when a reviewed release PR is merged (#601).
#
# Every push to main runs `detect`, which decides from git facts only (never a
# PR title): __version__ changed compared with the first parent, CHANGELOG.md
# has a dated `## [X.Y.Z] - YYYY-MM-DD` section, and tag vX.Y.Z is absent (or
# already at this commit, which resumes). Anything else is "no release" and the
# run ends after `detect` and `summary`.
#
# A release runs in this one workflow with explicit `needs:` (tags and Releases
# created with GITHUB_TOKEN trigger no other workflow). Release content is
# checked out at the detected SHA; the guard and summary scripts come from the
# workflow's own commit (the same SHA on a push):
#   consistency  make release-check
#   matrix       integration-full.yml through workflow_call
#   build        wheel + sdist once, twine check, smoke installs, SHA-256 list,
#                release notes and SBOM; artifacts kept 14 days for recovery
#   publish      annotated tag at the SHA, draft GitHub Release + SBOM, PyPI
#                upload of that artifact through the duplicate guard (OIDC,
#                `pypi` environment), then the Release is published
#   verify-cookbook  cubrid-cookbook-python smoke-test.yml for that exact version,
#                called as a reusable workflow (jobs of this run, no token)
#   require-cookbook status success and installed == requested
#   summary      one table; always runs
#
# Recovery dispatch (main only for resume/verify-only; see RELEASING.md):
#   gh workflow run publish-pypi.yml -f action=resume -f version=X.Y.Z
#   gh workflow run publish-pypi.yml -f action=verify-only -f version=X.Y.Z
#   gh workflow run publish-pypi.yml --ref <branch> -f action=dry-run -f version=X.Y.Z
# It never creates a new version, never moves a tag and never deletes PyPI files.
#
# Canonical cubrid-lab release workflow, kept identical across pycubrid,
# sqlalchemy-cubrid and cubrid-mcp-server except for the filename (this repo
# keeps the registered PyPI publisher identity), the `env:` block below and
# the smoke-test steps of the build job and the package name in the `with:`
# inputs of verify-cookbook.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Recovery action (see RELEASING.md)"
        required: true
        type: choice
        options:
          - dry-run
          - verify-only
          - resume
      version:
        description: "Version X.Y.Z (resume/verify-only: an existing tag on main; dry-run: __version__ of the ref)"
        required: true
        type: string

env:
  PACKAGE: sqlalchemy-cubrid
  VERSION_FILE: sqlalchemy_cubrid/__init__.py

# One run per pushed commit or per dispatched version; never cancelled. The
# publish job additionally serializes on its tag across push and dispatch runs.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  detect:
    name: Detect release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
      build: ${{ steps.detect.outputs.build }}
      publish: ${{ steps.detect.outputs.publish }}
      verify: ${{ steps.detect.outputs.verify }}
      mode: ${{ steps.detect.outputs.mode }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      sha: ${{ steps.detect.outputs.sha }}
      tag_state: ${{ steps.detect.outputs.tag_state }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Validate recovery inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTION: ${{ inputs.action }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z"
            exit 1
          fi
          if [ "$ACTION" != "dry-run" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::$ACTION must be dispatched from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Check out the pushed or dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: detect
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'push' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release_detect.py --mode "$MODE" --sha "$GITHUB_SHA" \
            --version "$INPUT_VERSION" --version-file "$VERSION_FILE"

  consistency:
    name: Release consistency (make release-check)
    needs: [detect]
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install release-check tools
        run: python -m pip install --upgrade pip build twine packaging

      - name: make release-check
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: make release-check VERSION="$VERSION"

  matrix:
    name: Full compatibility matrix
    needs: [detect, consistency]
    if: needs.detect.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/integration-full.yml
    with:
      sha: ${{ needs.detect.outputs.sha }}

  build:
    name: Build and verify the release artifact
    needs: [detect, matrix]
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hashes.outputs.sha256 }}
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          python3 scripts/extract_release_notes.py "$TAG"
          mkdir -p release-meta
          mv RELEASE_NOTES.md release-meta/RELEASE_NOTES.md

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: release-meta/sbom.spdx.json
          upload-artifact: false

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: |
          twine check dist/*
          shopt -s nullglob
          matches=(dist/"${PACKAGE//-/_}"-"$VERSION"*)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::Built artifacts do not carry version $VERSION"
            ls -l dist/
            exit 1
          fi

      # Repository-specific smoke assertions.
      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python - <<'PY'
          import os
          import importlib.metadata as md
          import sqlalchemy_cubrid
          expected = os.environ["VERSION"]
          assert sqlalchemy_cubrid.__version__ == expected, (sqlalchemy_cubrid.__version__, expected)
          assert md.version("sqlalchemy-cubrid") == expected, (md.version("sqlalchemy-cubrid"), expected)
          from sqlalchemy_cubrid import insert, merge, JSON, SET  # noqa: F401
          eps = {ep.name: ep for ep in md.entry_points(group="sqlalchemy.dialects") if ep.name.startswith("cubrid")}
          for name in ("cubrid", "cubrid.cubrid", "cubrid.pycubrid", "cubrid.aiopycubrid"):
              assert name in eps, (name, sorted(eps))
          # Alembic is not installed here: the dialect's optional CubridImpl
          # registration (#504) must be skipped, not break dialect loading.
          from sqlalchemy.dialects import registry
          for name in ("cubrid", "cubrid.pycubrid", "cubrid.aiopycubrid"):
              assert registry.load(name).name == "cubrid", name
          import pathlib
          pkg_dir = pathlib.Path(sqlalchemy_cubrid.__file__).parent
          assert (pkg_dir / "py.typed").exists(), "py.typed marker missing"
          print("wheel import + metadata + entry points + py.typed OK:", expected)
          PY

      - name: Smoke-test sdist install
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/sdist-env/bin/python -c "import sqlalchemy_cubrid; print('sdist import OK:', sqlalchemy_cubrid.__version__)"

      - name: Record SHA-256 hashes
        id: hashes
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *) | tee release-meta/SHA256SUMS
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, pathlib
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pathlib.Path("dist").iterdir())}
          print("sha256=" + json.dumps(hashes, separators=(",", ":")))
          PY

      - name: Upload the verified distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Upload release notes, SBOM and hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-meta
          path: release-meta/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Tag, GitHub Release and PyPI
    needs: [detect, consistency, matrix, build]
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PACKAGE }}/${{ needs.detect.outputs.version }}/
    permissions:
      contents: write # annotated tag and GitHub Release
      id-token: write # PyPI Trusted Publishing
    concurrency:
      group: release-publish-${{ needs.detect.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.detect.outputs.sha }}
      TAG: ${{ needs.detect.outputs.tag }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      # Release tooling (guard, Release title check and summary scripts) comes from the
      # workflow's own commit, so a resume or verify-only of an older tag uses
      # the current scripts; on a push it is the release SHA itself.
      - name: Check out the PyPI duplicate guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/pypi_duplicate_guard.py
            scripts/check_release_title.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the verified distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/

      - name: Download release notes, SBOM and hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta
          path: release-meta/

      - name: Check the distribution against the recorded hashes
        run: (cd dist && sha256sum --strict -c ../release-meta/SHA256SUMS)

      # Creates the annotated tag at the release SHA, or accepts one that already
      # points there (resume). A tag at any other commit fails; tags never move.
      - name: Create the annotated tag
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.type + \" \" + .object.sha")
          if [ -n "$ref" ]; then
            read -r type target <<<"$ref"
            if [ "$type" = "tag" ]; then
              target=$(gh api "repos/$GH_REPO/git/tags/$target" --jq .object.sha)
            fi
            if [ "$target" != "$SHA" ]; then
              echo "::error::$TAG already points at $target, not $SHA; tags are never moved"
              exit 1
            fi
            echo "$TAG already at $SHA; resuming"
          else
            object=$(gh api -X POST "repos/$GH_REPO/git/tags" -f tag="$TAG" -f type=commit \
              -f object="$SHA" -f message="$PACKAGE $TAG" --jq .sha)
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
            echo "created annotated tag $TAG at $SHA"
          fi

      - name: Create the draft GitHub Release with the SBOM
        run: |
          set -euo pipefail
          # List (drafts included) instead of `gh release view`, so an API error
          # fails the step instead of reading as "no Release yet".
          drafts=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | .draft')
          # A Release reused on resume or recovery must already be titled exactly
          # $TAG (AGENTS.md "GitHub Release Policy"); it is never renamed here.
          if [ "$drafts" = true ] || [ "$drafts" = false ]; then
            title=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | .name // ""')
            python3 scripts/check_release_title.py --tag "$TAG" --title="$title" --draft "$drafts"
          fi
          case "$drafts" in
            "")
              gh release create "$TAG" --draft --verify-tag --title "$TAG" \
                --notes-file release-meta/RELEASE_NOTES.md release-meta/sbom.spdx.json ;;
            true)
              gh release upload "$TAG" release-meta/sbom.spdx.json --clobber
              echo "reusing draft Release $TAG" ;;
            false)
              echo "Release $TAG is already published; leaving it unchanged" ;;
            *)
              echo "::error::several Releases carry $TAG; resolve them by hand"
              exit 1 ;;
          esac

      # Fails on a filename PyPI already serves with a different SHA-256, on a
      # file PyPI serves for this version that the verified build did not
      # produce, or when PyPI cannot be queried; drops files PyPI already serves
      # byte for byte (partial-upload recovery with `gh run rerun --failed`).
      - name: Compare dist/ with files already on PyPI
        id: guard
        run: python3 scripts/pypi_duplicate_guard.py --project "$PACKAGE" --version "$VERSION" --dist dist

      # No skip-existing: PyPI rejects a filename that already holds different
      # bytes. Only an explicit upload=false (every file already identical on
      # PyPI) skips this step; a missing guard output still uploads.
      - name: Publish to PyPI
        if: steps.guard.outputs.upload != 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

      - name: Publish the GitHub Release
        run: gh release edit "$TAG" --draft=false

  # The cookbook smoke test runs as jobs of this run through workflow_call
  # (cubrid-cookbook-python CONTRIBUTING, "Release verification contract"): no
  # token, no secrets, no polling. Pinned to a cookbook `main` commit; Dependabot
  # moves the pin to the newest `main` commit (see RELEASING.md).
  verify-cookbook:
    name: Cookbook release verification
    needs: [detect, build, publish]
    # After a successful publish; or, without publishing, after a successful
    # dry-run build or for verify-only.
    if: >-
      !cancelled() && needs.detect.outputs.verify == 'true' &&
      (needs.publish.result == 'success' ||
      (needs.detect.outputs.publish != 'true' &&
      (needs.detect.outputs.mode == 'verify-only' || needs.build.result == 'success')))
    permissions:
      contents: read # all the called workflow needs
    uses: cubrid-lab/cubrid-cookbook-python/.github/workflows/smoke-test.yml@32e80c6ea9ae78324f764d7b873ffb64b000ddcc # main
    with:
      package: sqlalchemy-cubrid
      version: ${{ needs.detect.outputs.version }}
      request_id: sqlalchemy-cubrid-v${{ needs.detect.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The called workflow fails on a failed verification, but its outputs are
  # still set; this job enforces them, so a release is never reported as
  # verified unless the requested version is the one the cookbook installed.
  require-cookbook:
    name: Require a verified release
    needs: [detect, verify-cookbook]
    if: always() && needs.verify-cookbook.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require status success and installed == requested
        env:
          RESULT: ${{ needs.verify-cookbook.result }}
          STATUS: ${{ needs.verify-cookbook.outputs.status }}
          REQUESTED: ${{ needs.verify-cookbook.outputs.requested_version }}
          INSTALLED: ${{ needs.verify-cookbook.outputs.installed_version }}
          ARTIFACT: ${{ needs.verify-cookbook.outputs.artifact }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          echo "result=$RESULT status=$STATUS requested=$REQUESTED installed=$INSTALLED artifact=$ARTIFACT"
          if [ "$RESULT" = success ] && [ "$STATUS" = success ] && [ -n "$INSTALLED" ] \
            && [ "$INSTALLED" = "$REQUESTED" ] && [ "$REQUESTED" = "$VERSION" ]; then
            echo "Cookbook verified $PACKAGE==$INSTALLED (report artifact $ARTIFACT)"
          else
            echo "::error::Cookbook verification failed for $PACKAGE $VERSION: called workflow $RESULT, status '${STATUS:-none}', requested '${REQUESTED:-none}', installed '${INSTALLED:-none}'"
            exit 1
          fi

  summary:
    name: Release summary
    needs: [detect, consistency, matrix, build, publish, verify-cookbook, require-cookbook]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # sparse checkout of the summary script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release_summary.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Render the release summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/release_summary.py
