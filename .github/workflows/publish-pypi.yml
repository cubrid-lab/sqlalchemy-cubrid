# Publish to PyPI via Trusted Publisher (OIDC).
#
# Manual gate: dispatch after the tag-triggered integration-full passes:
#   gh workflow run publish-pypi.yml -f tag=vX.Y.Z
# The GitHub Release created by create-release.yml does NOT trigger this
# workflow. On success, the notify-cookbook job dispatches the cookbook smoke
# test. See RELEASING.md for the full procedure.
#
# Canonical cubrid-lab publish workflow — kept identical across pycubrid,
# sqlalchemy-cubrid, and cubrid-mcp-server. Only the package/module name and the
# smoke-test assertions differ between repos. Do not fork this structure without
# updating the siblings.
#
# Trusted Publisher config:
# https://pypi.org/manage/project/sqlalchemy-cubrid/settings/publishing/
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Build and verify release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.+-]*)$ ]]; then
            echo "::error::tag input '$INPUT_TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Extract version from __init__.py (AST, no import)
        run: |
          VERSION=$(python - <<'PY'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("sqlalchemy_cubrid/__init__.py").read_text())
          print(next(
              node.value.value
              for node in ast.walk(tree)
              if isinstance(node, ast.Assign)
              for target in node.targets
              if isinstance(target, ast.Name) and target.id == "__version__"
          ))
          PY
          )
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected package version: $VERSION"

      - name: Verify tag matches package version
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match package version (v$VERSION)"
            exit 1
          fi

      - name: Verify CHANGELOG has a dated entry
        run: |
          if ! grep -qP "^## \[$VERSION\] - \d{4}-\d{2}-\d{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing dated entry '## [$VERSION] - YYYY-MM-DD'"
            exit 1
          fi
          echo "CHANGELOG: $(grep -P "^## \[$VERSION\]" CHANGELOG.md | head -1)"

      - name: Verify tag commit is contained in main
        run: |
          git fetch --no-tags --quiet origin main
          TAG_COMMIT=$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error::Tag $TAG not found in repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $TAG ($TAG_COMMIT) is not contained in origin/main"
            exit 1
          fi
          echo "Tag $TAG commit $TAG_COMMIT verified on main"

      - name: Require the full compatibility matrix to have passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PyPI publish must not ship a version the full 5x4 Python x CUBRID
          # matrix did not validate. The reduced PR matrix only covers the
          # newest+oldest cells, so require a successful tag-triggered
          # integration-full run on this exact release commit.
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          success=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/integration-full.yml/runs?event=push&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$TAG_COMMIT\") | select(.conclusion == \"success\") | .id" \
            | head -1)
          if [ -z "$success" ]; then
            echo "::error::No successful Integration Full Matrix run found for $TAG ($TAG_COMMIT). The full compatibility matrix must pass before publishing."
            exit 1
          fi
          echo "Full compatibility matrix passed for $TAG_COMMIT (run $success)."

      - name: Require the GitHub Release and SBOM from create-release.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # create-release.yml uploads the SBOM as its last step, so a Release
          # carrying sbom.spdx.json means that workflow completed for this tag.
          if ! assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            echo "::error::GitHub Release $TAG not found. create-release.yml must succeed before publishing."
            exit 1
          fi
          if ! printf '%s\n' "$assets" | grep -qx 'sbom.spdx.json'; then
            echo "::error::GitHub Release $TAG has no sbom.spdx.json. Re-run create-release.yml before publishing."
            exit 1
          fi
          echo "GitHub Release $TAG with SBOM found."

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: |
          twine check dist/*
          shopt -s nullglob
          matches=(dist/sqlalchemy_cubrid-"$VERSION"*)
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::Built artifacts do not carry version $VERSION"
            ls -l dist/
            exit 1
          fi

      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python - <<'PY'
          import os
          import importlib.metadata as md
          import sqlalchemy_cubrid
          expected = os.environ["VERSION"]
          assert sqlalchemy_cubrid.__version__ == expected, (sqlalchemy_cubrid.__version__, expected)
          assert md.version("sqlalchemy-cubrid") == expected, (md.version("sqlalchemy-cubrid"), expected)
          from sqlalchemy_cubrid import insert, merge, JSON, SET  # noqa: F401
          eps = {ep.name: ep for ep in md.entry_points(group="sqlalchemy.dialects") if ep.name.startswith("cubrid")}
          for name in ("cubrid", "cubrid.cubrid", "cubrid.pycubrid", "cubrid.aiopycubrid"):
              assert name in eps, (name, sorted(eps))
          # Alembic is not installed here: the dialect's optional CubridImpl
          # registration (#504) must be skipped, not break dialect loading.
          from sqlalchemy.dialects import registry
          for name in ("cubrid", "cubrid.pycubrid", "cubrid.aiopycubrid"):
              assert registry.load(name).name == "cubrid", name
          import pathlib
          pkg_dir = pathlib.Path(sqlalchemy_cubrid.__file__).parent
          assert (pkg_dir / "py.typed").exists(), "py.typed marker missing"
          print("wheel import + metadata + entry points + py.typed OK:", expected)
          PY

      - name: Smoke-test sdist install
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/sdist-env/bin/python -c "import sqlalchemy_cubrid; print('sdist import OK:', sqlalchemy_cubrid.__version__)"

      - name: Upload verified distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          skip-existing: true

  notify-cookbook:
    name: Dispatch cookbook smoke test
    runs-on: ubuntu-latest
    needs: [deploy]
    # The dispatch uses COOKBOOK_DISPATCH_TOKEN (a PAT scoped to the cookbook
    # repo); this job needs no GITHUB_TOKEN permissions. The secret is only
    # referenced here, never in the build/verify or deploy jobs.
    permissions: {}
    steps:
      - name: Check dispatch token
        id: token
        env:
          COOKBOOK_DISPATCH_TOKEN: ${{ secrets.COOKBOOK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$COOKBOOK_DISPATCH_TOKEN" ]; then
            echo "::warning::COOKBOOK_DISPATCH_TOKEN not set; skipping cookbook dispatch"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch smoke test to cookbook
        if: steps.token.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.COOKBOOK_DISPATCH_TOKEN }}
          repository: cubrid-lab/cubrid-cookbook-python
          event-type: upstream-released
          client-payload: |
            {"package": "sqlalchemy-cubrid", "ref": "${{ inputs.tag }}"}
