name: Mark new issues for maintainer triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  mark-needs-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Flag the incoming issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'status: needs triage'
