# Minor and patch version updates are grouped into one PR per ecosystem and
# directory, so CI runs once instead of once per package (#737). Major updates,
# security updates and the compatibility-sensitive SQLAlchemy, pycubrid, Alembic
# and CUBRID-Python stay in their own PRs; the grouped PR still has to pass the
# required checks before auto-merge completes.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      dev-tools:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "sqlalchemy"
          - "pycubrid"
          - "alembic"
          - "CUBRID-Python"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/.github/docs-requirements"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      docs-tools:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
