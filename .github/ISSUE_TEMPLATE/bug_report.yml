name: Bug Report
description: Report a bug in sqlalchemy-cubrid
title: "bug: "
labels: ["bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        File problems and implementation requests in the repository that owns
        the affected code or docs. Other repositories keep separate acceptance,
        assignees and closure; cross-repository links are references only.
        **House rules**
        - File this issue in English.
        - For DDL or parse errors, include the exact failing SQL and the result of running
          it directly on the server with `csql`.
        - Verify any claimed reserved word against the CUBRID keyword list before reporting it.
        - Include a runnable reproduction.

  - type: markdown
    attributes:
      value: |
        Keep the `bug:` title prefix. You do not need to apply labels;
        maintainers assign priority and size after triage.
        Keep this body as the current specification; put dated progress in comments.
        Before implementation, check existing Assignees, claims and open PRs.
        Maintainer-operated autonomous agents also need issue-specific approval
        and assignment; human-led contributors need neither.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug
      placeholder: What is the bug about?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the bug
      placeholder: |
        1. First step
        2. Second step
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened
      placeholder: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment
      placeholder: |
        - Python version: 3.12
        - SQLAlchemy version: 2.0.0
        - CUBRID version: 11.2
        - sqlalchemy-cubrid version: 1.4.0
        - Operating System: Linux/macOS/Windows
    validations:
      required: true

  - type: textarea
    id: sql-verification
    attributes:
      label: DDL / SQL error verification
      description: >-
        Optional, but required when the report involves a DDL or parse error. Paste the exact
        failing SQL and the output of running it directly with `csql` on the server.
        Reserved-word claims must be checked against the CUBRID keyword list.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the bug here
      placeholder: Code snippets, error messages, logs, etc.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is included in this issue? What is explicitly excluded?
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and starting point
      description: Link the baseline commit, relevant files/tests and observed output. Separate source inspection from executed tests; say what is not verified.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria
      description: Give observable outcomes that decide when this issue is done. For research, state the decision or report to deliver.
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: Validation method
      description: State offline/live needs, environment and the command or manual check if known. Reporters may write unknown; maintainers refine this before implementation.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link the specific unfinished prerequisite and existing PR/claim. Completed work is a reference, not a blocker.
    validations:
      required: false
