repos:
  - repo: local
    hooks:
      - id: tooling-versions
        name: Check synchronized tooling versions
        entry: python3 scripts/check_tool_versions.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff-format
        entry: python3 -m ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: ruff
        entry: python3 -m ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: python3 -m mypy
        language: system
        files: "^(sqlalchemy_cubrid/|_sqlalchemy_cubrid_alembic\\.py$)"
        pass_filenames: false
        args: ["sqlalchemy_cubrid/", "_sqlalchemy_cubrid_alembic.py", "--config-file=pyproject.toml"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: "^(sqlalchemy_cubrid/|_sqlalchemy_cubrid_alembic\\.py$)"
