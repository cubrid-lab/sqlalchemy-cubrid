repos:
  - repo: local
    hooks:
      - id: tooling-versions
        name: Check synchronized tooling versions
        entry: python3 scripts/check_tool_versions.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff
        types_or: [python, pyi]
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        language: python
        files: "^sqlalchemy_cubrid/"
        pass_filenames: false
        args: ["sqlalchemy_cubrid/", "--config-file=pyproject.toml"]
        additional_dependencies:
          - "SQLAlchemy[asyncio]==2.0.53; python_version < '3.11'"
          - "SQLAlchemy[asyncio]==2.1.1; python_version >= '3.11'"
          - alembic>=1.7,<2.0

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: "^sqlalchemy_cubrid/"
