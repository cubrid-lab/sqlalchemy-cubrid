[sqla_testing]
requirement_cls = sqlalchemy_cubrid.requirements:Requirements
profile_file = test/profiles.txt

[db]
default = cubrid://dba@localhost:33000/testdb

[mutmut]
# mutmut 3.x (>=3.8). The whole package is copied into mutants/ so imports
# resolve, but only compiler.py is mutated. mutmut 3 runs pytest in-process
# (no custom runner) and adds -x -q itself. forkserver isolation forks each
# mutant from a process that has collected but not run the tests: a few tests
# (e.g. the MERGE keyed-column cases) define tables on module-level MetaData and
# cannot run twice in one process, which breaks the default fork mode.
source_paths = sqlalchemy_cubrid
# test/conftest.py imports scripts.integration_urls from its
# pytest_collection_modifyitems hook (#604). Into mutants/ mutmut copies
# source_paths plus a built-in list (test/, tests/, setup.cfg, pyproject.toml,
# lock files) and nothing else, so without this entry the hook raises
# ModuleNotFoundError during collection; raising from a hook makes pytest report
# an INTERNALERROR (exit 3) and mutmut stop at "failed to collect stats" (#628).
# Entries here are added to that built-in list, not substituted for it.
also_copy = scripts
only_mutate = sqlalchemy_cubrid/compiler.py
process_isolation = forkserver
pytest_add_cli_args =
    --no-cov
    -p
    no:cacheprovider
    -m
    not integration
pytest_add_cli_args_test_selection =
    test/test_compiler.py
    test/test_dialect_offline.py
    test/test_types.py
    test/test_json.py
