[sqla_testing]
requirement_cls = sqlalchemy_cubrid.requirements:Requirements
profile_file = test/profiles.txt

[db]
default = cubrid://dba@localhost:33000/testdb

[mutmut]
paths_to_mutate = sqlalchemy_cubrid/compiler.py
runner = env -u CUBRID_TEST_URL python3 -m pytest -x -q --no-cov -p no:cacheprovider -m "not integration" test/test_compiler.py test/test_dialect_offline.py test/test_types.py test/test_json.py
tests_dir = test/
